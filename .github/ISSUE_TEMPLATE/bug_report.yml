name: Bug Report
description: Report a bug or unexpected behaviour in wattnet-storage.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call `repo.write_metrics(...)`, it raises a `ConnectionError` even though ClickHouse is running."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps needed to reproduce the behaviour.
      placeholder: |
        1. Start ClickHouse with `docker compose up -d`
        2. Run `repo.write_metrics([...])`
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the full traceback if applicable.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: wattnet-storage Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g. 3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Ubuntu 24.04, macOS 15.2"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Configuration
      description: Paste any relevant log output or configuration (redact credentials).
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context that might help diagnose the issue.
    validations:
      required: false
