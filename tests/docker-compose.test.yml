services:
    clickhouse-test:
        image: clickhouse/clickhouse-server:latest
        container_name: clickhouse-test
        ports:
            - "18123:8123"
            - "19000:9000"
        volumes:
            - ./clickhouse/config/users.d:/etc/clickhouse-server/users.d:ro
        tmpfs:
            - /var/lib/clickhouse
            - /var/log/clickhouse-server
        healthcheck:
            test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 10s
