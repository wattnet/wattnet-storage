name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Build
        run: poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wattnet-storage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Build and push Docker image
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: wattnet
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/wattnet/wattnet-storage
            wattnet/wattnet-storage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign GHCR image
        run: cosign sign --yes ghcr.io/wattnet/wattnet-storage@${{ steps.build.outputs.digest }}

      - name: Sign DockerHub image
        run: cosign sign --yes wattnet/wattnet-storage@${{ steps.build.outputs.digest }}

  sbom:
    name: Generate and attach SBOMs
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate Python package SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          artifact-name: sbom-python.spdx.json
          upload-release-assets: true

      - name: Generate Docker image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/wattnet/wattnet-storage@${{ needs.docker.outputs.digest }}
          artifact-name: sbom-docker.spdx.json
          upload-release-assets: true
