[tool.poetry]
name = "wattnet-storage"
version = "1.1.1"
description = "Extensible plugin-based client for unified wattnet time-series metric storage across multiple backends."
license = "Apache-2.0"
authors = ["Jaime Iglesias Blanco <iglesias@ifca.es>"]
readme = "README.md"
homepage = "https://wattnet.eu"
repository = "https://github.com/wattnet/wattnet-storage"
keywords = [
    "energy", "electricity", "carbon", "carbon-footprint",
    "water", "water-footprint", "water-impact", "environmental-score",
    "time-series", "metrics", "storage", "clickhouse",
    "sustainability", "wattnet",
]
packages = [{ include = "wattnet" }]
include = ["config/.env.example"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.plugins."wattnet.storage.clients"]
clickhouse = "wattnet.storage.clients.plugins.clickhouse:ClickHouseClient"


[tool.poetry.dependencies]
python = ">=3.10,<3.15"
stevedore = "^5.7.0"
clickhouse-connect = {version = "^1.0", extras = ["pandas"]}
pydantic = "^2.0"
pydantic-settings = "^2.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0.0"

[tool.poetry.group.dev.dependencies]
tox = "^4.16.0"
tox-gh-actions = "^3.0"
pre-commit = "^4.0"

[tool.poetry.group.lint.dependencies]
ruff = "^0.17.2"

[tool.poetry.group.security.dependencies]
bandit = "^1.9.0"

[tool.poetry.group.deps.dependencies]
deptry = ">=0.23"

[tool.poetry.group.types.dependencies]
mypy = "^2.0"

[tool.poetry.group.release.dependencies]
twine = ">=4.0.2,<8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--tb=short"
markers = [
    "integration: requires a running ClickHouse instance (docker compose -f tests/docker-compose.test.yml up -d)",
]

[tool.coverage.run]
source = ["wattnet"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["wattnet"]
extend-exclude = ["env"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "D", "N", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["wattnet"]

[tool.deptry]
known_first_party = ["wattnet"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pytest", "pytest-cov",
    "tox", "tox-gh-actions",
    "pre-commit",
    "ruff",
    "bandit",
    "mypy",
    "twine",
    "deptry",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
