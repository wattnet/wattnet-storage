name: Feature Request
description: Propose a new feature or improvement for wattnet-storage.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe your proposal clearly so we can evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve, or what use case does it enable?
      placeholder: "I need to query metrics aggregated by hour, but the current API only supports raw data retrieval."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you would like to see.
      placeholder: "Add an optional `resolution` parameter to `query_metrics` that aggregates results into fixed-width time buckets."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this relate to?
      options:
        - Python client library
        - Storage backend (Docker Compose / ClickHouse)
        - Plugin / new backend
        - Configuration
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, examples, or references that support the request.
    validations:
      required: false
